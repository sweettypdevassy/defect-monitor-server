ibm:
  auth_method: password  # Using username/password authentication
  username: "username"
  password: "password"
  build_break_url: "https://libh-proxy1.fyre.ibm.com/buildBreakReport"
  soe_triage_url: "https://wasrtc.hursley.ibm.com:9443/jazz/web/projects/WS-CD#action=com.ibm.team.workitem.runSavedQuery&id=_fJ834OXIEemRB5enIPF1MQ"

slack:
  webhook_url: "https://hooks.slack.com/triggers/E27SFGS2W/105167857/a76a4f2c6667"  # Your Slack webhook URL
  channel: "#defect-notifications"  # Default channel
  username: "Defect Monitor Bot"
  icon_emoji: ":bug:"

# ML Training Configuration
ml_training:
  # Components to use for training the ML model
  # If empty or not specified, will use all_components
  # For testing: Use 3 components with good data
  training_components: 
  - name: "JAX-RS"
  - name: "JPA"
  - name: "Batch"
  - name: "JCA"
  - name: "Bean Validation"
  - name: "Classloading"
  - name: "MicroProfile REST Client"
  - name: "AdminCenter"


  # Weekly retraining schedule
  retrain_day: "monday"  # Day of week for retraining
  retrain_time: "14:57"
# Team-based monitoring (NEW!)
# Each team has its own components, schedule, and Slack webhook
teams:
  - name: "Team 1"
    components:
      - name: "JCA"
        notify: true
    check_time: "10:00"  # Different time for this team
    skip_weekends: false
    webhook_url: "https://hooks.slack.com/triggers/E27SFGS2W/10746/83682f8"
    slack_channel: "#messaging-defects"
    weekly_dashboard_day: "monday"   # Send weekly dashboard every Friday
    weekly_dashboard_time: "10:15"   # At 5:00 PM IST

  - name: "Team 2"
    components:
      - name: "JPA"
        notify: true
      - name: "JCA"
        notify: true
      - name: "Bean Validation"
        notify: true
    check_time: "10:30"  # Different time for this team
    skip_weekends: false
    webhook_url: "https://hooks.slack.com/triggers/E27SFGS2W/1067857/a76ab2c6e903667"
    slack_channel: "#messaging-defects"
    weekly_dashboard_day: "monday"   # Send weekly dashboard every Friday
    weekly_dashboard_time: "10:35"   # At 6:57 PM IST

 
all_components:
  - AdminCenter
  - App Client
  - Async Scheduling (Persistent Executor, CommonJ)
  - Batch
  - Bean Validation
  - Build
  - CDI
  - Classloading
  - Cloud/Virtualization
  - Core Security
  - Database (jdbc, oracle, db2, derby)
  - Docs
  - Dynacache
  - EE / MP Concurrency
  - EJB Container
  - IIOP/ORB
  - IBM i
  - Install
  - InstantOn
  - Intelligent Management
  - JAX-RS
  - Jakarta Data
  - Java EE Platform
  - JCA
  - JPA
  - JSON
  - Kernel/Bootstrap
  - MCP
  - Messaging
  - MicroProfile Core (config, fault tolerance, reactive)
  - MicroProfile GraphQL
  - MicroProfile Observability (metrics, open tracing, health)
  - MicroProfile Open API
  - MicroProfile REST Client
  - Mongo
  - OSGi Applications
  - Observability
  - Real-Time Comm (WebRTC, SIP)
  - Repository
  - Security SSO (jwt, oauth, oidc, social, mpjwt, saml)
  - Spring Boot
  - Systems Management
  - Transactions
  - Transport (cfw, http, ssl, websockets)
  - Usage Metering
  - WAS on Cloud
  - Web Comps (servlet, httpsession, jsp, jsf, etc)
  - Web Services
  - Web Services Security
  - WebSphere Automation
  - z/OS

schedule:
  # Legacy daily check (used if teams not configured)
 # daily_check_time: "10:00"  # HH:MM format (IST)
 # skip_weekends: true  # NEW: Skip Saturday and Sunday
  
  # Dashboard and background tasks
  #weekly_dashboard_day: "thursday"
  #weekly_dashboard_time: "17:25"
  all_components_fetch_time: "14:59"  # Background fetch for dashboard (optimized - no ML/duplicate detection)
  
  # Proactive 2FA authentication schedule
  # Authenticate at these times to keep session fresh and avoid mid-task logoffs
  proactive_auth_times:
    - "07:30"  # Morning authentication (before 8 AM fetch)
    - "19:28"  # Evening authentication (keeps session fresh for night)
  
  # For testing: specify components to fetch (if empty, fetches all_components)
  test_components:
  - name: "JPA"
  - name: "Batch"
  - name: "JCA"
  - name: "Bean Validation"
  - name: "Classloading"
  - name: "MicroProfile REST Client"
  - name: "JAX-RS"
  
  timezone: "Asia/Kolkata"

dashboard:
  port: 5000
  host: "0.0.0.0"
  public_url: "https://defectmonitoring.dev.fyre.ibm.com/dashboard"
  secret_key: "change-this-to-random-secret-key"
  retention_days: 90
  enable_component_explorer: true

database:
  type: "sqlite"
  path: "data/defects.db"

# Feature flags
features:
  all_components_tracking: true  # Enable background fetch for all components (for dashboard)

# Notification settings
notifications:
  only_notify_monitored: true  # Only send notifications for monitored components

logging:
  level: "INFO"
