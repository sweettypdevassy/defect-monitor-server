services:
  defect-monitor:
    build: .
    container_name: defect-monitor-server
    ports:
      - "5001:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./src:/app/src
      - ./templates:/app/templates
      - ./static:/app/static
      - ./jars:/app/jars:ro
      - ./scripts:/app/scripts:ro
    environment:
      - TZ=Asia/Kolkata
      - RTC_JARS_DIR=/app/jars
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - defect-monitor-network

volumes: {}

networks:
  defect-monitor-network:
    driver: bridge

